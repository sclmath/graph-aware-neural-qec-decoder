name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[dev]"
      - name: Report environment
        run: python -c "import sys, numpy, stim, pymatching, torch; print(sys.version); print('numpy', numpy.__version__); print('stim', stim.__version__); print('pymatching', pymatching.__version__); print('torch', torch.__version__)"
      - name: Run test suite
        run: python -m pytest -q